name: LambdaWorks patched image

on:
  push:
    branches: [lw-main]
    tags: ["lw-*"]
  pull_request:
    branches: [lw-main]

permissions:
  contents: read

concurrency:
  group: lw-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Unit and regression tests
        env:
          FORMLANDER_ENV: test
        run: go test -race ./internal/...

  publish:
    if: startsWith(github.ref, 'refs/tags/lw-') && github.repository == 'lambdaworks/formlander'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Derive image tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#lw-}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+-smtp-helo\.[0-9]+$ ]] || exit 1
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lambdaworks/formlander:${{ env.IMAGE_TAG }}
          build-args: COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/lambdaworks/formlander
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.licenses=MIT
      - name: Record deployment reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo '## Published image' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/lambdaworks/formlander:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/lambdaworks/formlander@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
